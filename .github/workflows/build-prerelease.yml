name: Build & Release Labrynth (Prerelease)

on:
  push:
    tags: ['v*.*.*-alpha.*', 'v*.*.*-beta.*', 'v*.*.*-rc.*']
  workflow_dispatch:
    inputs:
      reacher_ref:
        description: 'reacher branch/tag to bundle (e.g. v3.0.0-alpha.2, main, or a branch name)'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # -------------------------------------------------------------------
  # Gate — verify source files match the tag version + resolve reacher ref
  # -------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      reacher_ref: ${{ steps.reacher_ref.outputs.ref }}
      reacher_ref_source: ${{ steps.reacher_ref.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag is a prerelease
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ -(alpha|beta|rc)\. ]]; then
            echo "ERROR: build-prerelease.yml triggered by a non-prerelease tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify version consistency
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/bump-version.py --check "$VERSION"

      - name: Resolve reacher ref
        id: reacher_ref
        env:
          REACHER_REF_INPUT: ${{ inputs.reacher_ref || 'main' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tag-triggered: derive deterministically from the committed reacher pin
            REF=$(python scripts/bump-version.py --print-reacher-ref)
            if [ -z "$REF" ]; then
              echo "ERROR: Could not determine reacher ref from pyproject.toml pin" >&2
              exit 1
            fi
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "source=pyproject_pin" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: use the provided input (defaults to 'main')
            echo "ref=$REACHER_REF_INPUT" >> "$GITHUB_OUTPUT"
            echo "source=workflow_dispatch" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------
  # Windows — Inno Setup installer (.exe)
  # -------------------------------------------------------------------
  build-windows:
    needs: [version-check]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Download avrdude
        id: avrdude
        shell: pwsh
        run: |
          # Download avrdude directly from GitHub releases instead of
          # Chocolatey.  Chocolatey installs a shim that breaks when
          # relocated into a PyInstaller bundle.  The MSVC build is
          # statically linked — no DLLs needed.
          $version = "8.1"
          $zip = "avrdude-v${version}-windows-x64.zip"
          $url = "https://github.com/avrdudes/avrdude/releases/download/v${version}/${zip}"
          # SHA-256 pinned in-repo — update together with $version and the matching
          # pins in build-installers.yml + build.py (_AVRDUDE_SHA256).
          $expected = "e4d571d81fee3387d51bfdedd0b6565e4c201e974101cac2caec7adfd6201da3"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Host "ERROR: avrdude checksum mismatch. expected=$expected actual=$actual"
            exit 1
          }
          Write-Host "Verified avrdude SHA-256: $actual"
          Expand-Archive -Path $zip -DestinationPath avrdude-dist -Force
          $exe = Get-ChildItem -Path avrdude-dist -Filter "avrdude.exe" -Recurse -File |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: avrdude.exe not found in archive"
            Get-ChildItem avrdude-dist -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found avrdude at: $($exe.FullName)  ($($exe.Length) bytes)"
          # Log the version and the conf that ships with it. Pinned here, but
          # logged in all three jobs so the three bundles stay comparable.
          # The -? banner goes to stderr, and the version is its LAST line, not
          # its first — hence Select-String rather than Select-Object -First 1,
          # which would only ever print the "Usage:" header. This job runs under
          # $ErrorActionPreference='stop', where merging a native command's
          # stderr into the pipeline would abort the step.
          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & $exe.FullName "-?" 2>&1 | Select-String -Pattern "avrdude version" | Select-Object -First 1 | Write-Host
          $ErrorActionPreference = $prevEAP
          $env:AVRDUDE = $exe.FullName
          python -c "import os, build; print('avrdude.conf:', build.resolve_avrdude_conf(os.environ['AVRDUDE']))"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install reacher from source
        env:
          REACHER_REF: ${{ needs.version-check.outputs.reacher_ref }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$REACHER_REF" https://github.com/otis-lab-musc/reacher.git _reacher
          python -m pip install ./_reacher
          python -c "import reacher; print('reacher OK:', reacher.__version__)"

      - name: Install Python build tools
        run: python -m pip install pyinstaller prompt_toolkit httpx websockets

      - name: Build application
        run: python build.py --cli --avrdude "${{ steps.avrdude.outputs.path }}"

      - name: Smoke-test CLI bundle
        shell: bash
        run: ./dist/LabrynthCLI/LabrynthCLI.exe --selftest

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        env:
          VERSION_NUM: ${{ needs.version-check.outputs.version }}
        run: iscc installer\reacher.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/labrynth-${{ needs.version-check.outputs.version }}-windows-x64.exe

      - name: Package CLI bundle
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: tar -czf "dist/labrynth-cli-${VERSION}-windows-x64.tar.gz" -C dist LabrynthCLI

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-cli
          path: dist/labrynth-cli-${{ needs.version-check.outputs.version }}-windows-x64.tar.gz

  # -------------------------------------------------------------------
  # macOS — DMG disk image (.dmg) — Apple Silicon (arm64)
  # -------------------------------------------------------------------
  build-macos-arm64:
    needs: [version-check]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install avrdude
        run: brew install avrdude

      - name: Locate avrdude
        id: avrdude
        run: |
          AVRDUDE=$(which avrdude)
          echo "path=$AVRDUDE" >> "$GITHUB_OUTPUT"
          echo "Found avrdude at: $AVRDUDE"
          # brew's avrdude floats. Log the version and the conf that will be
          # bundled with it, so a drift shows up here rather than in a lab.
          # The -? banner goes to stderr (hence 2>&1) and the version is its
          # LAST line, not its first: usage() prints "Usage: ..." first and
          # "avrdude version <v> ..." last in every release 7.1 through 8.2.
          # Grep for it — head -1 only ever yields the usage header.
          "$AVRDUDE" -? 2>&1 | grep -i -m1 "avrdude version" || true
          AVRDUDE="$AVRDUDE" python -c 'import os, build; print("avrdude.conf:", build.resolve_avrdude_conf(os.environ["AVRDUDE"]))'

      - name: Install reacher from source
        env:
          REACHER_REF: ${{ needs.version-check.outputs.reacher_ref }}
        run: |
          git clone --depth 1 --branch "$REACHER_REF" https://github.com/otis-lab-musc/reacher.git _reacher
          python -m pip install ./_reacher
          python -c "import reacher; print('reacher OK:', reacher.__version__)"

      - name: Install Python build tools
        run: python -m pip install pyinstaller Pillow prompt_toolkit httpx websockets

      - name: Build application
        run: python build.py --cli --avrdude "${{ steps.avrdude.outputs.path }}"

      - name: Smoke-test CLI bundle
        run: ./dist/LabrynthCLI/LabrynthCLI --selftest

      - name: Create DMG
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          hdiutil create \
            -volname "Labrynth $VERSION" \
            -srcfolder dist/Labrynth.app \
            -ov -format UDZO \
            "dist/labrynth-${VERSION}-macos-arm64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: dist/labrynth-${{ needs.version-check.outputs.version }}-macos-arm64.dmg

      - name: Package CLI bundle
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: tar -czf "dist/labrynth-cli-${VERSION}-macos-arm64.tar.gz" -C dist LabrynthCLI

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-cli
          path: dist/labrynth-cli-${{ needs.version-check.outputs.version }}-macos-arm64.tar.gz

  # -------------------------------------------------------------------
  # Linux — desktop app (.deb + AppImage via electron-builder), browser-mode tarball,
  # CLI tarball. The desktop version comes from desktop/package.json, which
  # bump-version.py keeps equal to the tag version (enforced by --check above).
  # -------------------------------------------------------------------
  build-linux:
    needs: [version-check]
    # Pinned, not ubuntu-latest: the bundled avrdude is whatever this image's
    # apt pocket carries (noble → 7.1+dfsg-3build2), and the avrdude.conf
    # bundled beside it must come from that same package. Re-pointing
    # ubuntu-latest would swap both under us without a code change.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Node 22 here, not env.NODE_VERSION (20): Electron 44 needs node >= 22.12.
      # Windows/macOS keep 20. This job's frontend build runs on 22 as well.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install avrdude
        run: sudo apt-get update -qq && sudo apt-get install -y -qq avrdude

      - name: Locate avrdude
        id: avrdude
        run: |
          AVRDUDE=$(which avrdude)
          echo "path=$AVRDUDE" >> "$GITHUB_OUTPUT"
          echo "Found avrdude at: $AVRDUDE"
          # The bundled version is whatever the pocket carries, and the conf
          # bundled beside it must come from that same package (a conf from a
          # different avrdude release is a hard parse failure at upload time).
          # The -? banner goes to stderr (hence 2>&1) and the version is its
          # LAST line, not its first — grep for it rather than taking head -1.
          "$AVRDUDE" -? 2>&1 | grep -i -m1 "avrdude version" || true
          dpkg -s avrdude | grep '^Version:' || true
          AVRDUDE="$AVRDUDE" python -c 'import os, build; print("avrdude.conf:", build.resolve_avrdude_conf(os.environ["AVRDUDE"]))'

      - name: Install reacher from source
        env:
          REACHER_REF: ${{ needs.version-check.outputs.reacher_ref }}
        run: |
          git clone --depth 1 --branch "$REACHER_REF" https://github.com/otis-lab-musc/reacher.git _reacher
          python -m pip install ./_reacher
          python -c "import reacher; print('reacher OK:', reacher.__version__)"

      - name: Install Python build tools
        run: python -m pip install pyinstaller prompt_toolkit httpx websockets

      # --desktop: npm ci + tsc + electron-builder --linux (deb, AppImage, dir) under dist/desktop/.
      - name: Build application
        run: python build.py --cli --desktop --avrdude "${{ steps.avrdude.outputs.path }}"

      - name: Smoke-test CLI bundle
        run: ./dist/LabrynthCLI/LabrynthCLI --selftest

      # Starts the packaged Electron app under a virtual X display, waits for the
      # backend's /health, quits it, and checks that the processes and port are gone.
      # No step-level continue-on-error, so this step fails the job when the app is
      # broken. The job is still continue-on-error at job level, and the release job
      # runs under always(). A broken desktop build therefore does not block the
      # release. The release artifact check passes on the tarballs alone, so it does
      # not catch a missing .deb or AppImage.
      - name: Smoke-test desktop shell
        run: |
          sudo apt-get install -y -qq xvfb
          xvfb-run -a scripts/desktop-smoke.sh dist/desktop/linux-unpacked/labrynth

      - name: Build tarball
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: tar -czf "labrynth-${VERSION}-linux-x64.tar.gz" -C dist Labrynth

      - name: Build CLI tarball
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: tar -czf "labrynth-cli-${VERSION}-linux-x64.tar.gz" -C dist LabrynthCLI

      # Flatten into one directory. upload-artifact keeps paths relative to the
      # common ancestor, so uploading dist/desktop/* next to root-level files would
      # nest the .deb/.AppImage under dist/ and the release job's artifacts/*.deb glob
      # would miss them.
      - name: Stage Linux installers
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          mkdir -p linux-installers
          cp "dist/desktop/labrynth_${VERSION}_amd64.deb" \
             "dist/desktop/labrynth-${VERSION}-linux-x64.AppImage" \
             "labrynth-${VERSION}-linux-x64.tar.gz" \
             "labrynth-cli-${VERSION}-linux-x64.tar.gz" \
             linux-installers/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: linux-installers/*

  # -------------------------------------------------------------------
  # Release — publish artifacts; proceeds even with partial platform coverage
  # -------------------------------------------------------------------
  release:
    needs: [build-windows, build-macos-arm64, build-linux, version-check]
    runs-on: ubuntu-latest
    # Run even if some build jobs failed (continue-on-error makes them report 'success'),
    # but only for tag-triggered runs and only if version-check passed.
    if: always() && github.ref_type == 'tag' && needs.version-check.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Verify at least one artifact was produced
        run: |
          shopt -s nullglob
          assets=(artifacts/*.exe artifacts/*.dmg artifacts/*.deb artifacts/*.tar.gz artifacts/*.AppImage)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "ERROR: no installer artifacts were produced - refusing to publish an empty release." >&2
            echo "       The release notes name a bundled reacher version, so an assetless release" >&2
            echo "       is indistinguishable from a good one for anyone reading the release page." >&2
            exit 1
          fi
          echo "Attaching ${#assets[@]} artifact(s):"
          printf '  %s\n' "${assets[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
          REACHER_REF: ${{ needs.version-check.outputs.reacher_ref }}
          REACHER_REF_SOURCE: ${{ needs.version-check.outputs.reacher_ref_source }}
        with:
          generate_release_notes: true
          prerelease: true
          body: |
            > **Pre-release build** — for lab beta-testers. May contain known bugs. Do not use in production experiments without explicit sign-off.

            **Labrynth:** `${{ needs.version-check.outputs.version }}` | **reacher bundled:** `${{ needs.version-check.outputs.reacher_ref }}` (resolved from ${{ needs.version-check.outputs.reacher_ref_source }})

            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows (x64) | `labrynth-*-windows-x64.exe` | Installer |
            | macOS (Apple Silicon) | `labrynth-*-macos-arm64.dmg` | M1/M2/M3/M4 |
            | Linux (Debian/Ubuntu) | `labrynth_*_amd64.deb` | Desktop app (native window). `sudo dpkg -i *.deb` |
            | Linux (portable) | `labrynth-*-linux-x64.AppImage` | Desktop app, portable |
            | Linux (tarball) | `labrynth-*-linux-x64.tar.gz` | Browser mode (opens your web browser) |
            | Terminal CLI (all platforms) | `labrynth-cli-*-<os>.tar.gz` | Headless TUI — extract and run `LabrynthCLI` |

            > Not all platforms may be available for this build — check the attached assets.

            ## Reporting issues
            Include: OS version, exact installer filename, and the reacher version shown in the app's About modal.

            <details>
            <summary>Platform-specific notes</summary>

            **macOS — Gatekeeper warning:** Until code signing is enabled, macOS will block
            the app on first launch. Right-click the .app → Open, or run:
            ```
            xattr -d com.apple.quarantine /Applications/Labrynth.app
            ```

            **Windows — SmartScreen warning:** Until code signing is enabled, Windows may
            show a SmartScreen warning. Click "More info" → "Run anyway".

            **Linux AppImage:** Make executable and run:
            ```
            chmod +x labrynth-*-linux-x64.AppImage
            ./labrynth-*-linux-x64.AppImage
            ```

            **Linux desktop app:** `labrynth --browser` starts the backend and opens your
            web browser instead of the app window.
            </details>
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*.AppImage
