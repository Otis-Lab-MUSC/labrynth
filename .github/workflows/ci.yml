name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Frontend gate — ESLint + the TypeScript project build. `npm run build` runs
  # `tsc -b` before vite, so type errors already break release builds; running
  # `tsc -b` here surfaces them on the PR instead of at tag time.
  #
  # Deliberately no `--max-warnings 0`: the tree carries 34 pre-existing
  # react-hooks warnings. Errors fail the job, warnings do not.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript build
        run: npx tsc -b

      # The terminal CLI carries a Python copy of the web's session presets and
      # command tables (cli/presets.py). Diff them by value so "SA High" means
      # the same session from either surface. Stdlib-only; reuses web's esbuild.
      - name: CLI/web preset parity
        working-directory: .
        run: python3 scripts/check-cli-parity.py

  # Version gate — pyproject.toml is the source of truth; verify web/package.json
  # and the README badge agree with it. Catches a hand-edited version, which
  # `scripts/bump-version.py` exists to prevent.
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check version consistency
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "pyproject.toml version: $version"
          python scripts/bump-version.py --check "$version"

  # Desktop gate — TypeScript typecheck of the Electron shell (desktop/).
  # Node is pinned to 22 rather than env.NODE_VERSION because electron 44
  # requires node >= 22.12.
  desktop:
    name: desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Typecheck only: skip the ~100 MB Electron binary download.
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: TypeScript
        run: npx tsc -p . --noEmit
