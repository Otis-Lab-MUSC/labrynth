name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Frontend gate — ESLint + the TypeScript project build. `npm run build` runs
  # `tsc -b` before vite, so type errors already break release builds; running
  # `tsc -b` here surfaces them on the PR instead of at tag time.
  #
  # Deliberately no `--max-warnings 0`: the tree carries 34 pre-existing
  # react-hooks warnings. Errors fail the job, warnings do not.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript build
        run: npx tsc -b

      # The terminal CLI carries a Python copy of the web's session presets and
      # command tables (cli/presets.py). Diff them by value so "SA High" means
      # the same session from either surface. Stdlib-only; reuses web's esbuild.
      - name: CLI/web preset parity
        working-directory: .
        run: python3 scripts/check-cli-parity.py

      # Windows refuses reserved device names (aux, nul, com1, ...) and forbidden
      # characters, so a tracked path like web/src/aux.ts breaks the Windows
      # installer build long after this job would have passed.
      - name: Windows path check
        working-directory: .
        run: python3 -I scripts/check-windows-paths.py && python3 -I scripts/check-windows-paths.py --self-test

  # Tables mirrored from reacher (pin metadata, device names, command codes,
  # firmware gaps) are generated from its schema dump. Regenerate them from the
  # reacher2p release pinned in pyproject.toml and fail on any difference, so a
  # hand edit or a forgotten `npm run gen:tables` cannot merge.
  generated-tables:
    name: generated tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned reacher
        run: |
          pin=$(sed -n 's/.*"reacher2p>=\([^"]*\)".*/\1/p' pyproject.toml)
          echo "reacher2p pin: $pin"
          python -m pip install "reacher2p==$pin"

      - name: Regenerate
        working-directory: web
        env:
          REACHER_SRC: installed
          PYTHON: python
        run: npm run gen:gaps && npm run gen:tables

      - name: Fail on drift
        run: |
          git status --porcelain -- web/src/generated cli
          git diff --exit-code -- web/src/generated cli
          test -z "$(git status --porcelain -- web/src/generated cli)"

  # Version gate — pyproject.toml is the source of truth; verify web/package.json
  # and the README badge agree with it. Catches a hand-edited version, which
  # `scripts/bump-version.py` exists to prevent.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check version consistency
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "pyproject.toml version: $version"
          python scripts/bump-version.py --check "$version"
