[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labrynth"
version = "3.0.1-beta.15"
description = "Labrynth application shell — build orchestrator and frontend"
requires-python = ">=3.10"
dependencies = [
    # PyPI distribution is "reacher2p" (the "reacher" name was taken); the import
    # package is still "reacher" (python -m reacher, importlib hex resolution).
    "reacher2p>=3.4.0b14",
    "pyinstaller>=6.0",
]

[project.optional-dependencies]
cli = [
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]
# Exact pins: the style ratchet (scripts/style-baseline.py) counts rule hits,
# and counts shift between tool releases.
dev = [
    "ruff==0.17.3",
    "mypy==2.4.0",
]

[project.scripts]
reacher-cli = "cli.__main__:main"

[tool.setuptools]
py-modules = ["build", "launcher"]
packages = ["cli"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["cli/reacher_tables.py"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["cli", "build.py", "launcher.py", "scripts"]
exclude = ["cli/reacher_tables\\.py$"]

# Packages without type stubs.
[[tool.mypy.overrides]]
module = ["prompt_toolkit", "prompt_toolkit.*", "websockets", "websockets.*", "PyInstaller", "PyInstaller.*", "reacher", "reacher.*"]
ignore_missing_imports = true
